name: validate-ugameke-facsimile-audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-ugameke-facsimile-audit.yml'
      - 'scripts/generate_ugameke_facsimile_audit_queue.py'
      - 'data/research/ameke_constellation_members.json'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate facsimile audit queue
        run: python3 scripts/generate_ugameke_facsimile_audit_queue.py
      - name: Validate queue state
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          d=Path('data/research')
          q=json.load((d/'ugameke_facsimile_audit_queue.json').open(encoding='utf-8'))
          s=json.load((d/'ugameke_facsimile_audit_queue_summary.json').open(encoding='utf-8'))
          assert q['human_reviewed'] is False and s['human_reviewed'] is False
          assert q['count']==s['candidate_count']==18
          assert s['signal_bearing_candidate_count']==14
          assert s['other_recovered_candidate_count']==4
          assert all(x['facsimile_reviewed'] is False and x['human_reviewed'] is False for x in q['records'])
          assert sum(1 for _ in csv.DictReader((d/'ugameke_facsimile_audit_queue.csv').open(encoding='utf-8')))==18
          print(json.dumps(s,ensure_ascii=False))
          PY
      - name: Commit generated queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/ugameke_facsimile_audit_queue.json data/research/ugameke_facsimile_audit_queue_summary.json data/research/ugameke_facsimile_audit_queue.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Regenerate ugameke facsimile audit queue'
          git pull --rebase origin main
          git push
