name: RHD 1.0 canonical, TEI, appendices and review packaging

on:
  pull_request:
    paths:
      - 'scripts/generate_rhd_canonical.py'
      - 'scripts/generate_rhd_tei.py'
      - 'scripts/generate_human_review_packets.py'
      - 'scripts/generate_appendix_candidates.py'
      - 'tests/validate_rhd_canonical.py'
      - 'tests/validate_rhd_tei.py'
      - 'tests/validate_human_review_packets.py'
      - 'tests/validate_appendix_candidates.py'
      - 'schemas/rhd-entry-1.0.schema.json'
      - 'source_profiles/**'
      - 'sources/steffel-1809-ocr-source.txt'
      - 'data/entries.csv'
      - 'data/corpus_inventory.json'
      - 'data/validation/**'
      - 'data/research/diachronic_semantic_context_queue.json'
      - '.github/workflows/rhd-canonical.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_rhd_canonical.py'
      - 'scripts/generate_rhd_tei.py'
      - 'scripts/generate_human_review_packets.py'
      - 'scripts/generate_appendix_candidates.py'
      - 'tests/validate_rhd_canonical.py'
      - 'tests/validate_rhd_tei.py'
      - 'tests/validate_human_review_packets.py'
      - 'tests/validate_appendix_candidates.py'
      - 'schemas/rhd-entry-1.0.schema.json'
      - 'source_profiles/**'
      - 'sources/steffel-1809-ocr-source.txt'
      - 'data/entries.csv'
      - 'data/corpus_inventory.json'
      - 'data/validation/**'
      - 'data/research/diachronic_semantic_context_queue.json'
      - '.github/workflows/rhd-canonical.yml'

permissions:
  contents: read

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validators
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema
          sudo apt-get update -qq
          sudo apt-get install -y -qq jing
      - name: Generate canonical projection
        run: python3 scripts/generate_rhd_canonical.py
      - name: Validate canonical invariants and JSON Schema
        run: python3 tests/validate_rhd_canonical.py
      - name: Generate rich RHD TEI and strict Lex-0 projection
        run: python3 scripts/generate_rhd_tei.py
      - name: Validate RHD/TEI separation invariants
        run: python3 tests/validate_rhd_tei.py
      - name: Validate strict projection against official TEI Lex-0 0.9.5 RNG
        run: |
          curl -fsSL https://lex-0.org/schema/lex-0.rng -o /tmp/lex-0.rng
          jing /tmp/lex-0.rng data/tei/rhd-steffel-1809-lex0.xml
      - name: Generate appendix OCR candidates
        run: python3 scripts/generate_appendix_candidates.py
      - name: Validate appendix OCR candidates
        run: python3 tests/validate_appendix_candidates.py
      - name: Generate human-review packets
        run: python3 scripts/generate_human_review_packets.py
      - name: Validate human-review packet coverage and neutrality
        run: python3 tests/validate_human_review_packets.py
