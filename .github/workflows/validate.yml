name: validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate.yml'
      - 'sources/steffel-1809-ocr-source.txt'
      - 'data/entries_curated.csv'
      - 'data/review/**'
      - 'data/diplomatic/**'
      - 'data/facsimile/**'
      - 'data/validation/review/**'
      - 'data/diachronic/source_registry.json'
      - 'project-metadata.json'
      - 'scripts/extract_full_corpus.py'
      - 'scripts/apply_review_overrides.py'
      - 'scripts/generate_review_queue.py'
      - 'scripts/generate_validation_queue.py'
      - 'scripts/generate_next_philological_batch.py'
      - 'scripts/generate_human_review_priority.py'
      - 'scripts/generate_diachronic_correspondences.py'
      - 'scripts/generate_probable_graphic_correspondences.py'
      - 'scripts/generate_diachronic_adjudication_queue.py'
      - 'scripts/sync_project_metadata.py'
      - 'scripts/generate_exports.py'
      - 'tests/validate.py'
      - 'tests/validate_validation_phase.py'
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Rarámuri Digital comparison source
        uses: actions/checkout@v4
        with:
          repository: fersandovalgtz/raramuri-digital
          ref: 156921f4edfe27d784edc1e6444867eaa368f2e5
          path: .tmp-raramuri-digital
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure primary OCR source
        run: |
          if [ ! -f sources/steffel-1809-ocr-source.txt ]; then
            curl -L --fail --retry 3 -o sources/steffel-1809-ocr-source.txt https://archive.org/download/tarahumarischesw00stef/tarahumarischesw00stef_djvu.txt
          fi
          echo "6df508cd8c63db030cfa0339f8fdd45980c01d1dc7f85b310059f233653c9fb8  sources/steffel-1809-ocr-source.txt" | sha256sum -c -
      - name: Regenerate corpus, validation state and diachronic candidates
        run: |
          python3 scripts/extract_full_corpus.py
          python3 scripts/apply_review_overrides.py
          python3 scripts/generate_review_queue.py
          python3 scripts/generate_validation_queue.py
          python3 scripts/generate_next_philological_batch.py
          python3 scripts/generate_human_review_priority.py
          python3 scripts/generate_diachronic_correspondences.py
          python3 scripts/generate_probable_graphic_correspondences.py
          python3 scripts/generate_diachronic_adjudication_queue.py
          python3 scripts/sync_project_metadata.py
          python3 scripts/generate_exports.py
      - name: Validate corpus, layout, diplomatic layer and exports
        run: |
          python3 tests/validate.py
          python3 tests/validate_validation_phase.py
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.')
          d=root/'data/diachronic'
          exact=json.load((d/'exact_graphic_candidates.json').open(encoding='utf-8'))
          exact_summary=json.load((d/'exact_graphic_candidates_summary.json').open(encoding='utf-8'))
          probable=json.load((d/'probable_graphic_candidates.json').open(encoding='utf-8'))
          probable_summary=json.load((d/'probable_graphic_candidates_summary.json').open(encoding='utf-8'))
          adjudication=json.load((d/'adjudication_queue.json').open(encoding='utf-8'))
          adjudication_summary=json.load((d/'adjudication_queue_summary.json').open(encoding='utf-8'))
          registry=json.load((d/'source_registry.json').open(encoding='utf-8'))
          pm=json.load((root/'project-metadata.json').open(encoding='utf-8'))
          modern=next(x for x in registry['sources'] if x['role']=='contemporary')
          commit=modern['commit']
          assert re.fullmatch(r'[0-9a-f]{40}',commit)

          exact_records=exact['records']
          assert exact['count']==len(exact_records)
          assert exact['human_reviewed'] is False
          assert exact_summary['candidate_count']==len(exact_records)
          exact_pairs=set(); hids=set(); mids=set(); keys=set()
          for i,x in enumerate(exact_records,1):
              assert x['correspondence_id']==f'RHD-CORR-{i:06d}'
              h=x['historical']; m=x['modern']; rel=x['candidate_relation']; rv=x['independent_review']
              assert h['direction']=='RAR-DE'
              assert re.fullmatch(r'RHD-S1809-[0-9]{5}',h['record_id'])
              assert re.fullmatch(r'RD-[0-9]{6}',m['record_id'])
              assert h['match_key']==m['match_key']==rel['graphic_key']
              assert rel['type']=='exact_normalized_graphic_match' and rel['status']=='machine_candidate'
              assert x['derivation']['modern_commit']==commit
              assert rv['human_reviewed'] is False and rv['decision']=='not_assessed'
              pair=(h['record_id'],h['matched_component_index'],m['record_id'],m['matched_component_index'])
              assert pair not in exact_pairs
              exact_pairs.add(pair); hids.add(h['record_id']); mids.add(m['record_id']); keys.add(rel['graphic_key'])
          assert exact_summary['historical_records_with_candidates']==len(hids)
          assert exact_summary['modern_records_matched']==len(mids)
          assert exact_summary['unique_graphic_keys']==len(keys)
          assert pm['scope']['diachronic_exact_graphic_candidates']==len(exact_records)

          probable_records=probable['records']
          assert probable['count']==len(probable_records)
          assert probable['human_reviewed'] is False
          assert probable_summary['candidate_count']==len(probable_records)
          probable_pairs=set(); phids=set(); pmids=set(); distance_counts={}
          component_counts={}
          for i,x in enumerate(probable_records,1):
              assert x['correspondence_id']==f'RHD-PCORR-{i:06d}'
              h=x['historical']; m=x['modern']; rel=x['candidate_relation']; rv=x['independent_review']
              assert h['direction']=='RAR-DE'
              assert re.fullmatch(r'RHD-S1809-[0-9]{5}',h['record_id'])
              assert re.fullmatch(r'RD-[0-9]{6}',m['record_id'])
              assert rel['type']=='probable_graphic_correspondence' and rel['status']=='machine_candidate'
              assert rel['historical_graphic_key'] != rel['modern_graphic_key']
              assert rel['edit_distance'] in (1,2)
              assert x['derivation']['modern_commit']==commit
              assert rv['human_reviewed'] is False and rv['decision']=='not_assessed'
              pair=(h['record_id'],h['matched_component_index'],m['record_id'],m['matched_component_index'])
              assert pair not in probable_pairs and pair not in exact_pairs
              probable_pairs.add(pair); phids.add(h['record_id']); pmids.add(m['record_id'])
              distance_counts[str(rel['edit_distance'])]=distance_counts.get(str(rel['edit_distance']),0)+1
              comp=(h['record_id'],h['matched_component_index'])
              component_counts[comp]=component_counts.get(comp,0)+1
              assert component_counts[comp] <= 3
          assert probable_summary['historical_records_with_candidates']==len(phids)
          assert probable_summary['modern_records_matched']==len(pmids)
          assert probable_summary['edit_distance_counts']==distance_counts
          assert probable_summary['historical_components_with_candidates']==len(component_counts)
          assert probable_summary['human_reviewed'] is False
          assert probable_summary['modern_commit']==commit

          adj=adjudication['records']
          source_ids={x['correspondence_id'] for x in exact_records}|{x['correspondence_id'] for x in probable_records}
          assert adjudication['count']==len(adj)==len(source_ids)
          assert adjudication['human_reviewed'] is False
          assert adjudication['automatic_semantic_judgment'] is False
          assert adjudication['automatic_etymological_judgment'] is False
          assert adjudication['automatic_historical_continuity_judgment'] is False
          seen=set(); tier_counts={}; semantic_ready=0
          previous=(0,10**9)
          for i,x in enumerate(adj,1):
              assert x['adjudication_id']==f'RHD-ADJ-{i:06d}'
              assert x['source_candidate_id'] in source_ids and x['source_candidate_id'] not in seen
              seen.add(x['source_candidate_id'])
              assert x['source_cohort'] in ('exact','probable')
              assert x['priority_tier'] in (1,2,3,4)
              assert x['review_evidence']['automatic_semantic_judgment']=='not_performed'
              assert x['review_evidence']['automatic_etymological_judgment']=='not_performed'
              assert x['review_evidence']['automatic_historical_continuity_judgment']=='not_performed'
              assert x['independent_adjudication']['human_reviewed'] is False
              assert x['independent_adjudication']['decision']=='not_assessed'
              key=(x['priority_tier'],-x['priority_score'])
              assert key>=previous
              previous=key
              tier_counts[str(x['priority_tier'])]=tier_counts.get(str(x['priority_tier']),0)+1
              semantic_ready+=int(x['review_evidence']['semantic_evidence_available'])
          assert seen==source_ids
          assert adjudication_summary['candidate_count']==len(adj)
          assert adjudication_summary['priority_tier_counts']==tier_counts
          assert adjudication_summary['semantic_evidence_available_count']==semantic_ready
          assert adjudication_summary['human_reviewed_count']==0
          assert pm['editorial_pipeline']['diachronic_modern_source_commit']==commit
          assert pm['editorial_pipeline']['diachronic_human_reviewed_candidates']==0
          print(f"OK diachronic cohorts: exact={len(exact_records)} probable={len(probable_records)} adjudication={len(adj)}; human reviewed=0")
          PY
      - name: Commit regenerated artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/steffel-1809-ocr-source.txt data public/data manifest.json project-metadata.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "main advanced to a newer commit; skipping generated-artifact push because the newer validate run will regenerate them"
              exit 0
            fi
            git commit -m "Apply editorial overlays and regenerate corpus"
            git push
          fi
