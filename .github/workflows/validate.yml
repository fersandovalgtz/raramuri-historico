name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate derived exports
        run: python3 scripts/build_exports.py
      - name: Validate canonical data and exports
        run: python3 tests/validate.py
