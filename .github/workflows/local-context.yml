name: local-context
on:
  push:
    branches: [main]
    paths: ['.github/workflows/local-context.yml','scripts/generate_ameke_local_context_candidates.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/generate_ameke_local_context_candidates.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/research/ameke_local_context_candidates*
          git diff --cached --quiet && exit 0
          git commit -m 'Generate local context candidates'
          git pull --rebase origin main
          git push
