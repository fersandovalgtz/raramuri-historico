name: ugameke-jackknife
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_ugameke_jackknife_robustness.py'
      - 'data/research/ameke_local_function_contexts.json'
      - '.github/workflows/ugameke-jackknife.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/generate_ugameke_jackknife_robustness.py
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/research/ugameke_jackknife_robustness_summary.json').read_text(encoding='utf-8'))
          assert s['human_reviewed'] is False
          assert s['analyses']['single_class_article_jackknife']['leave_one_out_count'] > 0
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/research/ugameke_jackknife_robustness_summary.json data/research/ugameke_jackknife_robustness.csv
          git diff --cached --quiet || git commit -m 'Generate ugameke jackknife robustness'
          git pull --rebase origin main
          git push
