name: local-alignment-proposals
on:
  push:
    branches: [main]
    paths: ['.github/workflows/local-alignment-proposals.yml','scripts/local_alignment_proposals.py','data/research/ameke_facsimile_occurrence_corrections.json']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/local_alignment_proposals.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/research/ameke_local_context_ai_proposals*
          git diff --cached --quiet && exit 0
          git commit -m 'Generate local alignment proposals'
          git pull --rebase origin main
          git push
