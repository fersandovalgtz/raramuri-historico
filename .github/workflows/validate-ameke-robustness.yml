name: validate-ameke-robustness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_ameke_robustness_controls.py'
      - 'data/research/ameke_constellation_members.json'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate robustness controls
        run: python3 scripts/generate_ameke_robustness_controls.py
      - name: Validate robustness artifacts
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          d=Path('data/research')
          x=json.load((d/'ameke_ugameke_robustness_controls.json').open(encoding='utf-8'))
          s=json.load((d/'ameke_ugameke_robustness_controls_summary.json').open(encoding='utf-8'))
          assert x['human_reviewed'] is False and s['human_reviewed'] is False
          assert s['target_graphic_class']=='ugameke'
          assert s['target_german_context_proxy']=='infinitive_ending_proxy'
          assert s['permutation_test_count']==10 and s['permutation_scheme_count']==5
          assert s['leave_one_target_member_out']['case_count']==27
          assert len(x['permutation_tests'])==10
          assert sum(1 for _ in csv.DictReader((d/'ameke_ugameke_robustness_permutations.csv').open(encoding='utf-8')))==10
          print(json.dumps(s,ensure_ascii=False))
          PY
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/ameke_ugameke_robustness_controls.json data/research/ameke_ugameke_robustness_controls_summary.json data/research/ameke_ugameke_robustness_permutations.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Regenerate ameke robustness controls'
          git pull --rebase origin main
          git push
