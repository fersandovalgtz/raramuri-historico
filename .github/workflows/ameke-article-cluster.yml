name: ameke-article-cluster
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_ameke_article_cluster_robustness.py'
      - 'data/research/ameke_local_function_contexts.json'
      - '.github/workflows/ameke-article-cluster.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/generate_ameke_article_cluster_robustness.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/research/ameke_article_cluster_robustness_summary.json data/research/ameke_article_cluster_robustness_tests.json data/research/ameke_article_cluster_robustness_tests.csv
          git diff --cached --quiet || git commit -m 'Generate ameke article-cluster robustness'
          git pull --rebase origin main
          git push
