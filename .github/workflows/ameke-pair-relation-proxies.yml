name: ameke-pair-relation-proxies
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_ameke_pair_relation_proxies.py'
      - 'data/research/ameke_exact_base_pair_contexts.json'
      - '.github/workflows/ameke-pair-relation-proxies.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/generate_ameke_pair_relation_proxies.py
      - name: Validate and save generated proxies
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/research/ameke_exact_base_pair_relation_proxies_summary.json').read_text(encoding='utf-8'))
          assert s['pair_count']==10
          assert sum(s['target_expression_family_counts'].values())==10
          assert s['human_reviewed'] is False
          assert s['automatic_raramuri_semantic_classification'] is False
          assert s['automatic_morphological_analysis'] is False
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/research/ameke_exact_base_pair_relation_proxies.json data/research/ameke_exact_base_pair_relation_proxies_summary.json
          git diff --cached --quiet || git commit -m 'Generate documentary relation proxies for exact ameke pairs'
          git pull --rebase origin main
          git push
