name: validate-ameke-token-aware-permutation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_ameke_token_aware_permutation.py'
      - 'data/research/ameke_token_aware_members.json'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate token-aware permutation controls
        run: python3 scripts/generate_ameke_token_aware_permutation.py
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/ameke_token_aware_permutation_tests.json data/research/ameke_token_aware_permutation_tests.csv data/research/ameke_token_aware_permutation_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Regenerate token-aware ameke permutation controls'
          git pull --rebase origin main
          git push
