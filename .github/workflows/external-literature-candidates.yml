name: external-literature-candidates
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/generate_external_literature_candidates.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/research/external_literature_comparison_candidates*.json
          git diff --cached --quiet || git commit -m 'Generate external literature comparison candidates'
          git pull --rebase origin main
          git push
