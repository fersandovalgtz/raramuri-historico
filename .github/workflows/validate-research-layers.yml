name: validate-research-layers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/research_common.py'
      - 'scripts/generate_de_rar_attestations.py'
      - 'scripts/generate_residual_span_triage.py'
      - 'scripts/generate_residual_recovery_queue.py'
      - 'scripts/generate_graphic_family_hypotheses.py'
      - 'scripts/generate_graphic_context_associations.py'
      - 'scripts/generate_internal_concordance.py'
      - 'scripts/generate_ameke_constellation.py'
      - 'scripts/generate_ameke_permutation_tests.py'
      - 'scripts/update_ameke_research_page.py'
      - 'scripts/generate_historical_variants.py'
      - 'scripts/generate_semantic_context_queue.py'
      - 'scripts/generate_graphemic_statistics.py'
      - 'scripts/generate_research_statistics.py'
      - 'scripts/generate_research_snapshot.py'
      - 'scripts/sync_research_metadata.py'
      - 'scripts/update_research_docs.py'
      - 'data/entries.csv'
      - 'data/diachronic/**'
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate research layers
        run: |
          python3 scripts/generate_de_rar_attestations.py
          python3 scripts/generate_residual_span_triage.py
          python3 scripts/generate_residual_recovery_queue.py
          python3 scripts/generate_graphic_family_hypotheses.py
          python3 scripts/generate_graphic_context_associations.py
          python3 scripts/generate_internal_concordance.py
          python3 scripts/generate_ameke_constellation.py
          python3 scripts/generate_ameke_permutation_tests.py
          python3 scripts/generate_historical_variants.py
          python3 scripts/generate_semantic_context_queue.py
          python3 scripts/generate_graphemic_statistics.py
          python3 scripts/generate_research_statistics.py
          python3 scripts/generate_research_snapshot.py
          python3 scripts/sync_research_metadata.py
          python3 scripts/update_research_docs.py
          python3 scripts/update_ameke_research_page.py
      - name: Validate non-adjudicative research state
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          d=Path('data/research')
          a=json.load((d/'de_rar_inventory_guided_attestations.json').open(encoding='utf-8'))
          r=json.load((d/'de_rar_residual_span_candidates.json').open(encoding='utf-8'))
          t=json.load((d/'de_rar_residual_span_triage.json').open(encoding='utf-8'))
          ts=json.load((d/'de_rar_residual_span_triage_summary.json').open(encoding='utf-8'))
          rq=json.load((d/'de_rar_residual_recovery_queue.json').open(encoding='utf-8'))
          rqs=json.load((d/'de_rar_residual_recovery_queue_summary.json').open(encoding='utf-8'))
          gf=json.load((d/'graphic_family_hypotheses.json').open(encoding='utf-8'))
          gp=json.load((d/'graphic_pattern_hypotheses.json').open(encoding='utf-8'))
          gfs=json.load((d/'graphic_family_hypotheses_summary.json').open(encoding='utf-8'))
          gcp=json.load((d/'graphic_context_pattern_associations.json').open(encoding='utf-8'))
          gcf=json.load((d/'graphic_context_family_associations.json').open(encoding='utf-8'))
          gcs=json.load((d/'graphic_context_associations_summary.json').open(encoding='utf-8'))
          c=json.load((d/'internal_concordance.json').open(encoding='utf-8'))
          am=json.load((d/'ameke_constellation_members.json').open(encoding='utf-8'))
          ac=json.load((d/'ameke_base_contrast_candidates.json').open(encoding='utf-8'))
          ams=json.load((d/'ameke_constellation_summary.json').open(encoding='utf-8'))
          ap=json.load((d/'ameke_permutation_tests.json').open(encoding='utf-8'))
          aps=json.load((d/'ameke_permutation_tests_summary.json').open(encoding='utf-8'))
          v=json.load((d/'historical_variant_index.json').open(encoding='utf-8'))
          s=json.load((d/'diachronic_semantic_context_queue.json').open(encoding='utf-8'))
          q=json.load(open('data/diachronic/adjudication_queue.json',encoding='utf-8'))
          st=json.load((d/'corpus_research_statistics.json').open(encoding='utf-8'))
          pm=json.load(open('project-metadata.json',encoding='utf-8'))
          assert a['human_reviewed'] is False and r['human_reviewed'] is False and t['human_reviewed'] is False and rq['human_reviewed'] is False
          assert gf['human_reviewed'] is False and gp['human_reviewed'] is False and gcp['human_reviewed'] is False and gcf['human_reviewed'] is False
          assert am['human_reviewed'] is False and ac['human_reviewed'] is False and ams['human_reviewed'] is False and ap['human_reviewed'] is False and aps['human_reviewed'] is False
          assert gf['automatic_morphological_analysis'] is False and gf['automatic_morpheme_assignment'] is False
          assert gp['automatic_morphological_analysis'] is False and gp['automatic_morpheme_assignment'] is False
          assert gcp['automatic_semantic_classification'] is False and gcp['automatic_part_of_speech_tagging'] is False
          assert gcf['automatic_semantic_classification'] is False and gcf['automatic_part_of_speech_tagging'] is False
          assert gcs['automatic_semantic_classification'] is False and gcs['automatic_part_of_speech_tagging'] is False and gcs['automatic_morphological_analysis'] is False
          assert am['automatic_morphological_analysis'] is False and am['automatic_morpheme_assignment'] is False
          assert ac['automatic_morphological_analysis'] is False and ac['automatic_semantic_judgment'] is False
          assert ams['automatic_morphological_analysis'] is False and ams['automatic_morpheme_assignment'] is False and ams['automatic_semantic_classification'] is False and ams['automatic_paradigm_inference'] is False
          assert ap['automatic_morphological_analysis'] is False and ap['automatic_semantic_classification'] is False
          assert aps['automatic_morphological_analysis'] is False and aps['automatic_morpheme_assignment'] is False and aps['automatic_semantic_classification'] is False and aps['automatic_part_of_speech_tagging'] is False and aps['automatic_paradigm_inference'] is False
          assert c['human_reviewed'] is False and v['human_reviewed'] is False and s['human_reviewed'] is False
          assert t['count']==r['count']==ts['candidate_count']
          assert rq['count']==rqs['unique_recovery_candidate_groups']
          assert gf['count']==gfs['family_hypothesis_count']==gfs['grade_a_seed_count']==rqs['evidence_grade_counts']['A_machine_documentary_signal']
          assert gp['count']==gfs['recurrent_prefix_pattern_count']+gfs['recurrent_suffix_pattern_count']
          assert gcp['count']==gcs['pattern_association_count']==gp['count']
          assert gcf['count']==gcs['family_association_count']==gf['count']
          assert am['count']==ams['member_count'] and ac['count']==ams['base_contrast_candidate_count']
          assert ap['count']==aps['cell_test_count'] and aps['member_count']==am['count'] and aps['permutation_iterations']==20000 and aps['random_seed']==1809
          assert len({x['test_id'] for x in ap['records']})==ap['count']
          assert sum(bool(x['conservative_permutation_signal']) for x in ap['records'])==aps['conservative_permutation_signal_count']
          assert all(not x['human_reviewed'] and x['status']=='machine_permutation_context_test' for x in ap['records'])
          assert all(x['graphic_key'].endswith('ameke') and not x['human_reviewed'] and x['status']=='machine_ameke_graphic_member' for x in am['records'])
          assert all(x['contrast_type'] in {'exact_shared_stripped_base','edit_distance_one_stripped_base_neighbor'} and not x['human_reviewed'] and x['status']=='machine_ameke_base_contrast_candidate' for x in ac['records'])
          assert len({x['member_id'] for x in am['records']})==am['count'] and len({x['contrast_id'] for x in ac['records']})==ac['count']
          assert sum(ams['exclusive_suffix_member_counts'].values())==ams['member_count']
          assert rq['automatic_language_identification'] is False and rq['automatic_lexeme_creation'] is False
          assert t['automatic_language_identification'] is False and t['automatic_lexeme_creation'] is False
          assert all(not x['human_reviewed'] and x['status']=='machine_triage_only' for x in t['records'])
          assert all(not x['human_reviewed'] and x['status']=='machine_recovery_candidate' for x in rq['records'])
          assert all(not x['human_reviewed'] and x['status']=='machine_graphic_family_hypothesis' for x in gf['records'])
          assert all(not x['human_reviewed'] and x['status']=='machine_graphic_pattern_hypothesis' for x in gp['records'])
          assert all(not x['human_reviewed'] and x['status']=='machine_documentary_context_association' for x in gcp['records'])
          assert all(not x['human_reviewed'] and x['status']=='machine_documentary_context_association' for x in gcf['records'])
          assert c['count']==a['count'] and s['count']==q['count']
          assert s['automatic_semantic_judgment'] is False and s['cross_language_semantic_similarity_computed'] is False
          assert all(not x['independent_review']['human_reviewed'] for x in s['records'])
          assert st['human_reviewed_internal_relations']==0 and st['human_reviewed_diachronic_relations']==0 and pm['scope']['research_layer_human_reviewed_relations']==0
          assert st['residual_span_triage_candidates']==t['count'] and st['residual_recovery_candidate_groups']==rq['count'] and st['graphic_family_hypothesis_count']==gf['count']
          assert st['graphic_context_pattern_association_count']==gcp['count'] and st['graphic_context_family_association_count']==gcf['count']
          assert st['ameke_constellation_member_count']==am['count'] and st['ameke_base_contrast_candidate_count']==ac['count'] and st['ameke_permutation_cell_test_count']==ap['count'] and st['ameke_permutation_conservative_signal_count']==aps['conservative_permutation_signal_count']
          assert sum(1 for _ in csv.DictReader((d/'internal_concordance.csv').open(encoding='utf-8')))==c['count']
          assert sum(1 for _ in csv.DictReader((d/'diachronic_semantic_context_queue.csv').open(encoding='utf-8')))==s['count']
          assert sum(1 for _ in csv.DictReader((d/'de_rar_residual_span_triage.csv').open(encoding='utf-8')))==t['count']
          assert sum(1 for _ in csv.DictReader((d/'de_rar_residual_recovery_queue.csv').open(encoding='utf-8')))==rq['count']
          assert sum(1 for _ in csv.DictReader((d/'graphic_family_hypotheses.csv').open(encoding='utf-8')))==gf['count']
          assert sum(1 for _ in csv.DictReader((d/'graphic_context_pattern_associations.csv').open(encoding='utf-8')))==gcp['count']
          assert sum(1 for _ in csv.DictReader((d/'graphic_context_family_associations.csv').open(encoding='utf-8')))==gcf['count']
          assert sum(1 for _ in csv.DictReader((d/'ameke_constellation_members.csv').open(encoding='utf-8')))==am['count']
          assert sum(1 for _ in csv.DictReader((d/'ameke_base_contrast_candidates.csv').open(encoding='utf-8')))==ac['count']
          assert sum(1 for _ in csv.DictReader((d/'ameke_permutation_tests.csv').open(encoding='utf-8')))==ap['count']
          assert Path('public/research.html').exists() and 'research.html' in Path('public/index.html').read_text(encoding='utf-8') and 'AMEKE_PERM_START' in Path('public/research.html').read_text(encoding='utf-8')
          assert 'Investigación interna de Steffel' in Path('README.md').read_text(encoding='utf-8') and 'AMEKE_PERM_README_START' in Path('README.md').read_text(encoding='utf-8')
          print('OK research layers:',a['count'],c['count'],s['count'],'residual',t['count'],'recovery',rq['count'],'graphic families',gf['count'],'patterns',gp['count'],'German-context',gcp['count'],gcf['count'],'ameke',am['count'],'contrasts',ac['count'],'permutation tests',ap['count'],'signals',aps['conservative_permutation_signal_count'])
          PY
      - name: Commit generated research artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research public/data/research-summary.json public/index.html public/research.html project-metadata.json README.md CHANGELOG.md
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then exit 0; fi
          git commit -m 'Regenerate ameke permutation controls and internal research layers'
          git push
