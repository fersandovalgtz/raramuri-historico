name: pages

on:
  workflow_dispatch:
  push:
    branches: [main, rhd-1.0-specification]
    paths:
      - 'public/**'
      - 'data/iiif/steffel-1809-pages-png72.tar.gz'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize exact-witness Steffel PNG72 package on RHD branch
        if: github.ref == 'refs/heads/rhd-1.0-specification'
        run: |
          set -euo pipefail
          payload=data/iiif/steffel-1809-pages-png72.tar.gz
          echo 'fa7cb36b26907b35e37b1d1bbad762b4ea0142535cb7174a2ff299c96c0f2e12  '"$payload" | sha256sum -c -
          mkdir -p public/iiif/steffel-1809/images
          rm -f public/iiif/steffel-1809/images/*.png
          tar -xzf "$payload" -C public/iiif/steffel-1809/images

      - name: Enforce complete Steffel IIIF publication package on RHD branch
        if: github.ref == 'refs/heads/rhd-1.0-specification'
        run: |
          set -euo pipefail
          test -f public/iiif/steffel-1809/manifest.json
          test -f public/iiif/steffel-1809/canvas-map.json
          count=$(find public/iiif/steffel-1809/images -maxdepth 1 -type f -name '*.png' | wc -l)
          test "$count" -eq 84
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('public/iiif/steffel-1809/manifest.json').read_text(encoding='utf-8'))
          assert len(manifest.get('items', [])) == 84, len(manifest.get('items', []))
          print('OK: complete Steffel IIIF package: 84 PNG + 84 Canvases')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
