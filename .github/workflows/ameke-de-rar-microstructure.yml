name: ameke-de-rar-microstructure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_ameke_de_rar_microstructure.py'
      - 'data/research/ameke_local_function_contexts.json'
      - '.github/workflows/ameke-de-rar-microstructure.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/generate_ameke_de_rar_microstructure.py
      - name: Validate and save generated microstructure
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/research/ameke_de_rar_microstructure_summary.json').read_text(encoding='utf-8'))
          assert s['human_reviewed'] is False
          assert s['automatic_part_of_speech_tagging'] is False
          assert s['automatic_morphological_analysis'] is False
          assert s['low_risk_context_count'] > 0
          assert s['permutation_iterations'] == 20000
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/research/ameke_de_rar_microstructure.json data/research/ameke_de_rar_microstructure_summary.json
          git diff --cached --quiet || git commit -m 'Generate DE-RAR ameke microstructure analysis'
          git pull --rebase origin main
          git push
