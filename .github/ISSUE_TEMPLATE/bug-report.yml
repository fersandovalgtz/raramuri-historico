name: Bug o problema de reproducibilidad
description: Reporte un fallo de software, exportación, validación, sitio o discrepancia reproducible.
title: "[bug] "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: Versión / commit
      description: Indique el tag o SHA exacto que está utilizando.
      placeholder: v1.0.0 / 441cbac...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Componente
      options:
        - Pipeline / scripts
        - Datos / exportación
        - TEI / TEI Lex-0
        - IIIF
        - Sitio web
        - Esquema / validación
        - Documentación
        - Otro
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Comportamiento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
      description: Incluya comandos, parámetros, sistema operativo, versión de Python/dependencias y hashes de insumos cuando sean relevantes.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs o evidencia adicional
      description: No publique secretos, tokens ni información sensible. Para vulnerabilidades use SECURITY.md.
  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones
      options:
        - label: Confirmé que el problema corresponde a la versión/commit indicado y no a otro snapshot del repositorio.
          required: true
        - label: Este reporte no contiene credenciales ni información sensible.
          required: true
